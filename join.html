<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Centaur Trivia | Join</title>
  <link rel="stylesheet" href="/assets/theme.css">
</head>
<body>
<main class="shell narrow">
  <div class="crest">♞</div>
  <h1>CENTAUR <span>TRIVIA</span></h1>
  <h2 class="phone-tagline">WELCOME TO THE ARENA</h2>
  <section id="formPanel" class="card">
    <h3>JOIN AN ARENA</h3>
    <form id="joinForm">
      <label for="code">Four-character room code</label>
      <input id="code" maxlength="6" autocomplete="off" required placeholder="K7P4">
      <label for="name">Your player name</label>
      <input id="name" maxlength="24" autocomplete="nickname" required placeholder="Enter your name">
      <button>JOIN GAME</button>
    </form>
  </section>
  <section id="waiting" class="card hidden">
    <h2>YOU'RE IN!</h2>
    <p>Waiting for the host to begin...</p>
    <h3><span id="count">0</span> / 60 players</h3>
    <p id="phase"></p>
  </section>
  <section id="playerGame" class="card hidden">
    <div id="playerMeta" class="eyebrow"></div>
    <h2 id="playerHeading">GET READY</h2>
    <p id="playerQuestion" class="big-question"></p>
    <div id="playerClock" class="clock"></div>
    <div id="answerChoices" class="answer-choices"></div>
    <p id="answerStatus"></p>
    <div id="playerLeaderboard"></div>
  </section>
  <div id="playerPause" class="player-pause hidden" role="status">
    <div class="player-pause-icon">Ⅱ</div>
    <h2>GAME PAUSED</h2>
    <p>WAITING FOR HOST</p>
  </div>
  <p id="message" class="message" role="status"></p>
</main>
<script src="/assets/join.js"></script>
</body>
</html>
